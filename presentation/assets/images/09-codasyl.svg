  <g fill="#6741D9"><rect x="134" y="18" width="112" height="36" rx="18"/><rect x="459" y="18" width="112" height="36" rx="18"/></g>
  <g fill="#D9480F"><rect x="134" y="184" width="112" height="36" rx="18"/><rect x="399" y="184" width="112" height="36" rx="18"/><rect x="561" y="184" width="88" height="36" rx="18"/></g>
  <g font-size="22" fill="white" font-weight="bold">
