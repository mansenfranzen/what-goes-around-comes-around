    <path stroke="#6741D9" d="M190 47 65 120 M190 47 195 120 M190 47 330 120 M515 47 465 120 M515 47 595 120"/>
    <path stroke="#D9480F" d="M65 120 190 200 M465 120 190 200 M195 120 455 200 M595 120 455 200 M330 120 605 200"/>
