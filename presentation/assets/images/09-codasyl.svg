  </g>
  <g font-size="22"><text x="65" y="128">valve</text><text x="195" y="128">pump</text><text x="330" y="128">seal</text><text x="465" y="128">nut</text><text x="595" y="128">bolt</text></g>
  <g font-size="17" font-weight="bold" text-anchor="start"><text x="12" y="42" fill="#6741D9">Suppliers</text><text x="12" y="209" fill="#B84500">Assemblies</text></g>
